# inkSeek Platform 镜像流水线
#
# 运行环境约束：Runner 是容器内 runner，没有 docker daemon / dind / privileged，
# 所以镜像统一用 kaniko 在容器内构建并推送，不依赖 docker build。
#
# 加速地址（都可在项目 CI/CD Variables 里覆盖）：
#   BASE_IMAGE_SOURCE      基础镜像的上游加速地址（node:24-bookworm-slim）
#   NPM_REGISTRY           npm 加速
#   APT_MIRROR             Debian apt 加速（运行镜像要装 nginx / ffmpeg / adb）
#   PRISMA_ENGINES_MIRROR  Prisma 引擎下载加速
#   KANIKO_IMAGE           kaniko 镜像（gcr.io 经 daocloud 加速）
#
# 基础镜像缓存：mirror:base 先把上游基础镜像逐字节复制到项目 registry
# （<registry>/<project>/base/node:<tag>）。之后每次构建的 FROM 都指向这份副本，
# 不再重复从第三方加速源拉取；基础镜像没变时该任务只做一次 manifest 存在性检查。
# 需要刷新上游补丁时，删除 registry 里对应的 base/node 标签，或手动运行流水线并
# 设置 FORCE_BASE_MIRROR=1。
#
# 触发：推送任意分支 / tag、页面手动运行、API 触发都会执行。

stages:
  - prepare
  - check
  - image

variables:
  BASE_IMAGE_SOURCE: docker.m.daocloud.io/library/node:24-bookworm-slim
  BASE_IMAGE_NAME: node
  BASE_IMAGE_TAG: 24-bookworm-slim
  NPM_REGISTRY: https://registry.npmmirror.com
  APT_MIRROR: http://mirrors.aliyun.com
  PRISMA_ENGINES_MIRROR: https://registry.npmmirror.com/-/binary/prisma
  PNPM_VERSION: "12.11.2"
  PRISMA_VERSION: "7.10.1"
  KANIKO_IMAGE: gcr.m.daocloud.io/kaniko-project/executor:debug

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - when: never

# 把基础镜像复制到项目 registry。manifest 已存在时直接跳过，只有首次或删掉标签后
# 才会真正从上游拉取并推送；之后每次流水线只做一次存在性检查，几秒完成。
mirror:base:
  stage: prepare
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  interruptible: true
  retry:
    max: 2
  script:
    - |
      BUILD_BASE_IMAGE="$CI_REGISTRY_IMAGE/base/$BASE_IMAGE_NAME:$BASE_IMAGE_TAG"
      repo_path="${CI_REGISTRY_IMAGE#"$CI_REGISTRY"/}/base/$BASE_IMAGE_NAME"
      if [ "$FORCE_BASE_MIRROR" != "1" ]; then
        # registry 走 Bearer challenge：先用 job token 换一个只带 pull 权限的令牌，
        # 再 HEAD manifest。任何一步失败（网络/鉴权/标签不存在）都回到完整镜像复制。
        server="${CI_SERVER_URL:-https://$CI_SERVER_HOST}"
        auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
        token=$(busybox wget -q -O - \
            --header="Authorization: Basic $auth" \
            "$server/jwt/auth?service=container_registry&client_id=docker&offline_token=true&scope=repository:$repo_path:pull" \
            2>/dev/null | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
        if [ -n "$token" ] && busybox wget -q --spider \
            --header="Authorization: Bearer $token" \
            --header="Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json" \
            "https://$CI_REGISTRY/v2/$repo_path/manifests/$BASE_IMAGE_TAG"; then
          echo "[ci] base image already mirrored: $BUILD_BASE_IMAGE"
          exit 0
        fi
      fi
      echo "[ci] mirroring $BASE_IMAGE_SOURCE -> $BUILD_BASE_IMAGE"
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    - |
      mkdir -p /tmp/base-context
      printf 'FROM %s\n' "$BASE_IMAGE_SOURCE" > /tmp/base-context/Dockerfile
      /kaniko/executor \
        --context dir:///tmp/base-context \
        --dockerfile /tmp/base-context/Dockerfile \
        --destination "$BUILD_BASE_IMAGE" \
        --snapshot-mode=redo \
        --image-download-retry=3 \
        --push-retry=3
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# 便宜的检查放在镜像之前：PR 里类型错误不应该先花几分钟跑一次 kaniko。
# 构建阶段会再次执行 pnpm build，但这里更早暴露问题，也覆盖 lint。
check:typecheck:
  stage: check
  # 基础镜像镜像化与检查互不依赖，check 不排队等 prepare。
  needs: []
  image:
    name: $BASE_IMAGE_SOURCE
    entrypoint: [""]
  interruptible: true
  variables:
    GIT_STRATEGY: clone
    # prisma generate 不连接数据库，但 prisma.config.ts 会读取 DATABASE_URL。
    DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - npm install -g pnpm@$PNPM_VERSION --registry "$NPM_REGISTRY" --no-audit --no-fund
    - pnpm config set registry "$NPM_REGISTRY"
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    # postinstall 已经会 generate；再显式跑一次，保证缓存恢复后 Prisma Client 一定存在。
    - pnpm install --frozen-lockfile
    - pnpm db:generate
    - pnpm typecheck
    - pnpm lint
    # web 的 build 是 tsc --noEmit && vite build，能同时拦住类型错误与产物构建问题。
    - pnpm build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# 公共 kaniko 任务：无 daemon，构建后直接推送到项目容器注册表。
# 镜像 tag 规则：sha-<short> 始终推送；tag 推版本号；默认分支推 latest；其他分支推分支 slug。
.docker_job:
  stage: image
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  interruptible: true
  # 加速镜像源偶发断流表现为 kaniko 退出码 1；整条 job 重跑一次即可恢复。
  # 真正的构建错误也会重试，最多 2 次。
  retry:
    max: 2
  variables:
    GIT_STRATEGY: clone
    DOCKER_TARGET: runtime
    DOCKER_REPO: $CI_REGISTRY_IMAGE
    DOCKER_CACHE_REPO: $CI_REGISTRY_IMAGE/cache
  script:
    - |
      # FROM 指向 registry 内的基础镜像副本，避免每次从第三方加速源重新拉取。
      BUILD_BASE_IMAGE="$CI_REGISTRY_IMAGE/base/$BASE_IMAGE_NAME:$BASE_IMAGE_TAG"
      dests="--destination ${DOCKER_REPO}:sha-${CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        dests="$dests --destination ${DOCKER_REPO}:${CI_COMMIT_TAG}"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        dests="$dests --destination ${DOCKER_REPO}:latest"
      else
        dests="$dests --destination ${DOCKER_REPO}:${CI_COMMIT_REF_SLUG}"
      fi
      echo "[ci] target=${DOCKER_TARGET} ref=${CI_COMMIT_REF_NAME} destinations: $dests"
    # 项目容器注册表凭据（GitLab 预置变量）。
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    # 加速参数与 OOM 取值：
    #   --snapshot-mode=redo       只比对 mtime/size/mode/uid/gid，不逐文件读内容。
    #   --use-new-run              用 marker + mtime 找变更，减少全盘快照时间。
    #   --compressed-caching=false 不把压缩层常驻内存，降低 pnpm 大依赖层的峰值内存。
    #   --ignore-path=/pnpm-store  排除 pnpm store；Dockerfile 里的 npm 缓存同理排除。
    #   --cache-repo               层缓存推回项目仓库，后续构建可直接命中。
    #   三个 retry 覆盖从加速镜像源拉层的瞬时中断。
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --target "$DOCKER_TARGET" \
        --build-arg NODE_IMAGE="$BUILD_BASE_IMAGE" \
        --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
        --build-arg APT_MIRROR="$APT_MIRROR" \
        --build-arg PRISMA_ENGINES_MIRROR="$PRISMA_ENGINES_MIRROR" \
        --build-arg PNPM_VERSION="$PNPM_VERSION" \
        --build-arg PRISMA_VERSION="$PRISMA_VERSION" \
        --cache=true \
        --cache-repo "$DOCKER_CACHE_REPO" \
        --snapshot-mode=redo \
        --use-new-run \
        --compressed-caching=false \
        --ignore-path=/pnpm-store \
        --ignore-path=/root/.npm \
        --ignore-path=/root/.cache \
        --image-download-retry=3 \
        --image-fs-extract-retry=3 \
        --push-retry=3 \
        $dests
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# 运行镜像：对外仅暴露 3000（Nginx）；Nest API 仅内部 127.0.0.1:3100。
docker:image:
  extends: .docker_job
  variables:
    DOCKER_TARGET: runtime
    DOCKER_REPO: $CI_REGISTRY_IMAGE
    DOCKER_CACHE_REPO: $CI_REGISTRY_IMAGE/cache

# 迁移镜像：常规版本升级由 runtime 容器启动时自动 `prisma migrate deploy`，无需手动跑。
# 本镜像保留给手动/应急迁移（例如回滚后单独补迁移）：
#   docker run --rm -e DATABASE_URL=... <registry>/<project>/migrate:<tag>
docker:migrate:
  extends: .docker_job
  variables:
    DOCKER_TARGET: migrate
    DOCKER_REPO: $CI_REGISTRY_IMAGE/migrate
    DOCKER_CACHE_REPO: $CI_REGISTRY_IMAGE/migrate/cache
