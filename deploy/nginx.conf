# inkSeek Platform 前端与 API 反向代理。
# 容器对外只暴露 3000：静态文件来自 apps/web/dist，/api/ 转发给仅监听回环的 127.0.0.1:3100。
error_log /dev/stderr warn;
access_log /dev/stdout;

server {
    listen 3000 default_server;
    server_name _;

    root /app/apps/web/dist;
    index index.html;

    # 与 API 的 JSON body limit 保持一致（聊天图片以 base64 传输）。
    client_max_body_size 50m;

    # SSE（聊天流）不能缓冲，也不能被短超时截断。
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://127.0.0.1:3100;
    }

    # Vite 产物带内容哈希，可以长缓存；缺失的静态文件直接 404，不落回 index.html。
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
